<body data-page="reset-password"><div class="wrap"><div class="auth-box">
 <h1>تعیینِ رمزِ جدید</h1><p class="sub">یک رمزِ عبورِ تازه برای حساب‌ات انتخاب کن.</p>
 <form id="form"><div class="err-line" id="err"></div>
  <div class="field"><label>رمزِ عبورِ جدید</label><input id="pass" type="password" required minlength="6" placeholder="حداقل ۶ حرف"></div>
  <div class="field"><label>تکرارِ رمز</label><input id="pass2" type="password" required></div>
  <button class="btn btn-primary" style="width:100%;padding:13px">ذخیرهٔ رمزِ جدید</button>
 </form>
</div></div>
